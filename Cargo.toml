[package]
name = "tokio-cpu-runtime"
version = "0.1.1"
description = "A capped Tokio runtime for CPU-bound asynchronous work"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/legra-ai/tokio-cpu-runtime"
readme = "README.md"
keywords = ["tokio", "async", "runtime", "cpu", "parallelism"]
categories = ["asynchronous", "concurrency"]

[dependencies]
qos-threads = "0.1.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
